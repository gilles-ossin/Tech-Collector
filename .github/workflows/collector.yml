name: Mon Premier Robot de Collecte

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures
  workflow_dispatch: # Permet de lancer le robot à la main quand tu veux pour tester !

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances (si besoin)
        run: pip install requests

      - name: Lancer le script de collecte
        run: python Parser.py
