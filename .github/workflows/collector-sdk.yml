name: Robot de Collecte SDK

on:
  schedule:
    - cron: '20 */5 * * *' # À la minute 20, toutes les 3 heures (00:20, 03:20, 06:20...)
  workflow_dispatch: # Permet de le lancer manuellement quand tu veux

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    # Donne les droits d'écriture au robot sur le dépôt
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script de collecte
        run: python Collectors/Parser-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour SDKs.json sur GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Datas/SDKs.json
          git diff --staged --quiet || (git commit -m "chore: mise à jour automatique de SDKs.json" && git push)
